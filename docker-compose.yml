services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-learning-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_learning}
      POSTGRES_USER: ${DB_USER:-ai_learning}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ai_learning_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_learning} -d ${DB_NAME:-ai_learning}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
    container_name: ai-learning-ai-service
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_GRACEFUL_DEGRADATION_ENABLED: ${AI_GRACEFUL_DEGRADATION_ENABLED:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    container_name: ai-learning-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ai_learning}
      DB_USER: ${DB_USER:-ai_learning}
      DB_PASSWORD: ${DB_PASSWORD:-ai_learning_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./client
    container_name: ai-learning-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
