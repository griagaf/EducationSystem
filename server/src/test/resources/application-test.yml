spring:
  datasource:
    url: jdbc:h2:mem:ai_learning_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,USERS;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  cors-allowed-origins: http://localhost:3000
  jwt-secret: test-jwt-secret
  jwt-access-token-ttl: PT30M
