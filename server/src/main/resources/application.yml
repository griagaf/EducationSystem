spring:
  application:
    name: ai-learning-platform-server
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_learning}
    username: ${DB_USER:ai_learning}
    password: ${DB_PASSWORD:ai_learning_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt-secret: ${JWT_SECRET:local-development-jwt-secret-change-me}
  jwt-access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
